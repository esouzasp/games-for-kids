<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cadê o Antonio?</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f1eadb; --dim:#a8a397; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#070808; color:var(--paper); font-family:'Josefin Sans', sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; aspect-ratio:960/544; width:min(100vw, calc(100vh * 960 / 544)); }
  canvas#game { width:100%; height:100%; display:block; background:#111; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(12,16,18,.45), rgba(5,6,8,.9)); }
  .hidden { display:none !important; }
  .panel { max-width:80%; text-align:center; }
  h1 { font-weight:300; font-size:clamp(26px,5vw,54px); letter-spacing:.18em; margin:0 0 8px; text-transform:uppercase; }
  .sub { font-weight:300; font-size:clamp(12px,1.5vw,16px); line-height:1.7; margin:0 0 14px; color:var(--dim); }
  .heroes { display:flex; gap:16px; justify-content:center; margin:4px 0 14px; flex-wrap:wrap; }
  .hero { background:linear-gradient(#7fa3a0, #f0caa0); padding:6px 10px 6px; cursor:pointer; opacity:.5; transition:opacity .2s, transform .2s; border:1px solid rgba(255,255,255,.2); }
  .hero canvas { width:84px; height:96px; display:block; margin:0 auto; }
  .hero span { display:block; font-size:11px; margin-top:4px; color:#1a1b1c; letter-spacing:.08em; text-transform:uppercase; font-weight:600; }
  .hero.sel { opacity:1; transform:translateY(-4px); }
  .row { display:flex; gap:22px; justify-content:center; align-items:flex-end; flex-wrap:wrap; }
  .field { text-align:center; }
  label { font-size:10px; display:block; margin-bottom:6px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
  input[type=text], select { font-family:inherit; font-size:15px; padding:6px 4px; border:0; border-bottom:1px solid rgba(241,234,219,.5); width:220px; max-width:90vw; text-align:center; background:transparent; color:var(--paper); outline:none; }
  select option { background:#1a1d20; color:#f1eadb; }
  button.small { font-family:inherit; font-size:11px; letter-spacing:.15em; text-transform:uppercase; background:transparent; color:var(--paper); border:1px solid rgba(241,234,219,.45); padding:6px 10px; cursor:pointer; margin-left:6px; }
  input[type=range] { width:120px; accent-color:#e6bf62; }
  button.big { font-family:inherit; font-size:clamp(12px,1.5vw,15px); letter-spacing:.3em; text-transform:uppercase; margin-top:18px; padding:12px 26px; background:transparent; color:var(--paper); border:1px solid rgba(241,234,219,.6); cursor:pointer; }
  button.big:hover, button.small:hover { background:rgba(241,234,219,.12); }
  #msgText { font-weight:300; font-size:clamp(13px,1.8vw,18px); line-height:1.8; margin:10px 0 0; }
  #msgTitle { font-weight:300; font-size:clamp(20px,3.4vw,36px); letter-spacing:.2em; text-transform:uppercase; }
  .keys { font-size:10px; color:var(--dim); margin-top:14px; letter-spacing:.15em; text-transform:uppercase; }
  .hint { font-size:10px; color:var(--dim); margin-top:6px; letter-spacing:.04em; max-width:520px; margin-left:auto; margin-right:auto; line-height:1.5; }
  #touch { position:absolute; inset:0; pointer-events:none; }
  .tbtn { position:absolute; bottom:4%; width:14%; aspect-ratio:1; max-width:100px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.3); pointer-events:auto; display:flex; align-items:center; justify-content:center; font-size:clamp(14px,3vw,24px); color:rgba(255,255,255,.7); touch-action:none; }
  .tbtn.on { background:rgba(255,255,255,.25); }
  #tl { left:3%; } #tr { left:19%; } #tj { right:3%; }
  .ptitle { font-weight:300; font-size:clamp(20px,3.4vw,36px); letter-spacing:.2em; text-transform:uppercase; margin-bottom:8px; }
  .pmenu { display:flex; flex-direction:column; align-items:center; gap:0; }
  .pmenu button.big { margin-top:12px; min-width:300px; }
  #menuBtn { position:absolute; top:2.4%; right:calc(1.6% + 130px); font-family:inherit; font-size:11px; letter-spacing:.15em; background:transparent; color:rgba(241,234,219,.75); border:1px solid rgba(241,234,219,.3); padding:6px 10px; cursor:pointer; text-transform:uppercase; }
  #mute { position:absolute; top:2.4%; right:1.6%; font-family:inherit; font-size:11px; letter-spacing:.15em; background:transparent; color:rgba(241,234,219,.75); border:1px solid rgba(241,234,219,.3); padding:6px 10px; cursor:pointer; text-transform:uppercase; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game" width="960" height="544"></canvas>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>Cadê o Antonio?</h1>
      <p class="sub">O Antonio, nosso whippet branco e marrom, sumiu na neblina. Quem vai procurar por ele?</p>
      <div class="heroes" id="heroes"></div>
      <div class="row">
        <div class="field">
          <label for="name">Nome do herói</label>
          <input type="text" id="name" maxlength="14" placeholder="digite o nome" autocomplete="off">
        </div>
      </div>
      <button class="big" id="startBtn">Começar</button>
      <div class="keys">← → andar &nbsp;·&nbsp; espaço pular &nbsp;·&nbsp; pule nos bichos &nbsp;·&nbsp; esc menu</div>
    </div>
  </div>

  <div id="msg" class="overlay hidden">
    <div class="panel">
      <div id="msgTitle"></div>
      <p id="msgText"></p>
      <button class="big" id="msgBtn">Continuar</button>
    </div>
  </div>

  <div id="touch" class="hidden">
    <div class="tbtn" id="tl">◀</div>
    <div class="tbtn" id="tr">▶</div>
    <div class="tbtn" id="tj">▲</div>
  </div>
  <div id="pause" class="overlay hidden">
    <div class="panel">
      <div class="ptitle">Pausa</div>
      <div class="pmenu">
        <button class="big" id="pResume">Continuar</button>
        <button class="big" id="pRestart">Reiniciar fase</button>
        <button class="big" id="pReset">Recomeçar do início</button>
        <button class="big" id="pQuit">Sair para o menu</button>
      </div>
    </div>
  </div>
  <button id="menuBtn" class="hidden">☰ menu</button>
  <button id="mute">som ligado</button>
</div></div>

<script>
(() => {
const T = 32, ROWS = 17, VW = 960, VH = 544;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Josefin Sans", sans-serif';

const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const r = Math.round((n >> 16) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k); return `rgb(${r},${g},${b})`; }

/* ---------------- personagens desenhados em vetor ---------------- */
const HEROES = [
  { id:'A', label:'Loirinho',  hair:'#e3bc5e', hairHi:'#f8de98', skin:'#f2c8a2', shirt:'#eef0ea', shirt2:'#cfd5d8', pants:'#3d5b7e', shoes:'#2a2a2c' },
  { id:'B', label:'Cacheado',  hair:'#3b2517', hairHi:'#5a3b26', skin:'#e3ae87', shirt:'#3b4757', shirt2:'#2c3542', pants:'#2e4a70', shoes:'#b3382d' },
  { id:'C', label:'Franjinha', hair:'#7a4b25', hairHi:'#a06a3a', skin:'#f0c7a6', shirt:'#232629', shirt2:'#e8e8e8', pants:'#45464f', shoes:'#ececec' },
];

function seg(g, x1, y1, x2, y2, w, c) { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function limb(g, ox, oy, a1, l1, a2, l2, w1, w2, c1, c2) {
  const kx = ox + Math.sin(a1) * l1, ky = oy + Math.cos(a1) * l1;
  const ex = kx + Math.sin(a2) * l2, ey = ky + Math.cos(a2) * l2;
  seg(g, ox, oy, kx, ky, w1, c1); seg(g, kx, ky, ex, ey, w2, c2);
  return [ex, ey];
}
function ell(g, x, y, rx, ry, rot, c) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); }

/* st: {speed 0..1, phase, ground, vy, land 0..1, t} — origem nos pés, olhando para a direita */
function drawBoy(g, st, H) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  const s = st.speed, ph = st.phase, gr = st.ground;
  const crouch = st.land * 5;
  const bob = gr ? -Math.abs(Math.sin(ph)) * 2.4 * s : 0;
  const hipX = 0, hipY = -23 + bob + crouch;
  const lean = gr ? 0.24 * s + crouch * 0.02 : 0.05 - clamp(st.vy * 0.02, -0.2, 0.2);
  const shX = hipX + Math.sin(lean) * 15, shY = hipY - Math.cos(lean) * 15;
  const legA = i => {
    if (gr) {
      if (s < 0.06) return [(i ? -0.08 : 0.1) + crouch * 0.06, (i ? -0.08 : 0.06) - crouch * 0.12];
      const p = ph + i * Math.PI, th = 0.85 * s * Math.sin(p), kn = 0.1 + 1.3 * s * Math.max(0, -Math.cos(p));
      return [th, th - kn];
    }
    if (st.vy < 0) return i ? [-0.45, -1.05] : [1.05, -0.15];
    return i ? [-0.2, -0.65] : [0.5, -0.2];
  };
  const armA = i => {
    if (gr) {
      if (s < 0.06) return [i ? 0.1 : -0.06, 0.3];
      const a = -0.95 * s * Math.sin(ph + i * Math.PI);
      return [a, a + 0.6 + 0.9 * s];
    }
    if (st.vy < 0) return i ? [2.6, 2.95] : [2.3, 2.7];
    const f = Math.sin(st.t * 0.35) * 0.3;
    return i ? [1.7 + f, 2.3] : [-1.3 - f, -0.7];
  };
  const pantsF = shade(H.pants, 0.7), shirtF = shade(H.shirt, 0.72), skinF = shade(H.skin, 0.75);
  // perna de trás
  let [a1, a2] = legA(1), [fx, fy] = limb(g, hipX - 1, hipY, a1, 11.5, a2, 11.5, 6, 5.2, pantsF, pantsF);
  ell(g, fx + 2, fy - 1, 4.4, 2.5, a2 * 0.3, shade(H.shoes, 0.7));
  // braço de trás
  [a1, a2] = armA(1); [fx, fy] = limb(g, shX - 1, shY + 2, a1, 9, a2, 8.5, 4.4, 3.6, shirtF, skinF);
  ell(g, fx, fy, 2.1, 2.1, 0, skinF);
  // tronco
  seg(g, hipX, hipY - 1, shX, shY + 1, 12, H.shirt);
  g.strokeStyle = H.shirt2; g.lineWidth = 1.6; g.beginPath(); g.moveTo(hipX - 4, hipY - 1); g.lineTo(hipX + 4.5, hipY - 1.5); g.stroke();
  ell(g, hipX, hipY + 1, 6.2, 3.6, lean, H.pants);
  // perna da frente
  [a1, a2] = legA(0); [fx, fy] = limb(g, hipX + 1, hipY, a1, 11.5, a2, 11.5, 6, 5.2, H.pants, H.pants);
  ell(g, fx + 2, fy - 1, 4.4, 2.5, a2 * 0.3, H.shoes);
  // cabeça
  const hx = shX + Math.sin(lean) * 7 + 0.5, hy = shY - 8.5 + crouch * 0.15;
  seg(g, shX, shY, hx - 0.5, hy + 5, 4, H.skin);
  ell(g, hx, hy, 8.2, 8.4, 0, H.skin);
  ell(g, hx - 2.2, hy + 1, 2, 2.4, 0, skinF);
  ell(g, hx + 4.6, hy - 0.2, 1.1, 1.3, 0, '#2a1c14');
  ell(g, hx + 3.6, hy + 3.4, 1.8, 1.2, 0, 'rgba(222,120,110,.35)');
  drawHair(g, hx, hy, st, H, s);
  // braço da frente
  [a1, a2] = armA(0); [fx, fy] = limb(g, shX + 1, shY + 2, a1, 9, a2, 8.5, 4.6, 3.8, H.shirt, H.skin);
  ell(g, fx, fy, 2.2, 2.2, 0, H.skin);
}
function drawHair(g, hx, hy, st, H, s) {
  const sway = -s * 0.35 + (st.ground ? 0 : clamp(st.vy * 0.03, -0.25, 0.25));
  g.fillStyle = H.hair;
  if (H.id === 'A') {
    g.beginPath(); g.arc(hx, hy - 0.5, 9, Math.PI * 0.92, Math.PI * 2.08); g.fill();
    ell(g, hx - 3.5, hy, 6.4, 7.2, 0.2, H.hair);
    for (let k = 0; k < 7; k++) {
      const base = -Math.PI + 0.15 + k * 0.42, a = base + sway * (1 - k / 7), r0 = 8.2;
      const bx = hx + Math.cos(base) * r0, by = hy - 0.5 + Math.sin(base) * r0;
      const tx = hx + Math.cos(a - 0.15) * (r0 + 4.5 + (k % 2) * 1.6), ty = hy - 0.5 + Math.sin(a - 0.15) * (r0 + 4.5 + (k % 2) * 1.6);
      g.beginPath(); g.moveTo(bx + Math.cos(base + 1.57) * 2.6, by + Math.sin(base + 1.57) * 2.6); g.lineTo(tx, ty); g.lineTo(bx - Math.cos(base + 1.57) * 2.6, by - Math.sin(base + 1.57) * 2.6); g.fill();
    }
    g.beginPath(); g.moveTo(hx + 2, hy - 8); g.quadraticCurveTo(hx + 10, hy - 6, hx + 8.5, hy - 1.5); g.lineTo(hx + 4.5, hy - 4); g.fill();
    g.strokeStyle = H.hairHi; g.lineWidth = 1.6; g.beginPath(); g.arc(hx - 1, hy - 1, 7, Math.PI * 1.15, Math.PI * 1.55); g.stroke();
  } else if (H.id === 'B') {
    ell(g, hx - 1.5, hy - 2, 9, 8, 0, H.hair);
    for (let k = 0; k < 11; k++) { const a = Math.PI * 0.75 + k * 0.17 * Math.PI + sway * 0.4; ell(g, hx - 1 + Math.cos(a) * 8.5, hy - 1.5 + Math.sin(a) * 8.5, 3.4, 3.4, 0, k % 2 ? H.hairHi : H.hair); }
    ell(g, hx + 5, hy - 6.5, 3, 2.6, 0, H.hair);
  } else {
    g.beginPath(); g.arc(hx - 0.5, hy - 0.5, 9.4, Math.PI * 0.9, Math.PI * 2.02); g.lineTo(hx + 9, hy - 1.5); g.lineTo(hx + 3, hy - 1.8); g.lineTo(hx - 6, hy + 7); g.lineTo(hx - 9, hy + 5); g.fill();
    g.strokeStyle = H.hairHi; g.lineWidth = 1.4; g.beginPath(); g.arc(hx - 1, hy - 1, 7.5, Math.PI * 1.2, Math.PI * 1.6); g.stroke();
    g.fillStyle = H.hair; g.beginPath(); g.moveTo(hx - 3, hy - 9); g.quadraticCurveTo(hx - 9 + sway * 6, hy - 12, hx - 11 + sway * 8, hy - 6); g.lineTo(hx - 6, hy - 6); g.fill();
  }
}

/* Antonio — whippet branco com cabeça e dorso marrom-claro. st: {speed, phase, t, wag, look} */
const DOGC = { w:'#f4f0e8', wF:'#cfc8bc', tan:'#b98f63', tanD:'#94704b', nose:'#1b1715' };
function drawDog(g, st) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  const run = st.speed, ph = st.phase;
  const flex = run ? Math.sin(ph) * 5.5 * run : 0;
  const bob = run ? -Math.abs(Math.cos(ph)) * 4 * run : Math.sin(st.t * 0.06) * 0.5;
  const ch = { x: 14 + flex * 0.5, y: -27 + bob + (run ? Math.sin(ph + 0.6) * 1.5 : 0) };
  const hu = { x: -14 - flex * 0.5, y: -27 + bob + (run ? Math.sin(ph + 2.2) * 1.5 : 0) };
  const leg = (bx, by, p, front, far) => {
    let a1, a2;
    if (run) {
      if (front) { a1 = Math.sin(p) * 0.95 * run; a2 = a1 - 0.7 * Math.max(0, Math.sin(p + 1.3)) * run; }
      else { a1 = 0.25 + Math.sin(p) * 0.9 * run; a2 = a1 - 0.6 - 0.5 * Math.max(0, Math.sin(p - 0.8)) * run; }
    } else { a1 = front ? 0.04 : 0.35; a2 = front ? 0.02 : -0.32; }
    const col = far ? DOGC.wF : DOGC.w;
    const [ex, ey] = limb(g, bx, by, a1, front ? 12 : 12.5, a2, front ? 13 : 13.5, front ? 4.2 : 5, 2.6, col, col);
    ell(g, ex + 1.2, ey - 0.6, 2.4, 1.5, 0, col);
  };
  // pernas de trás (lado oposto)
  leg(ch.x - 1, ch.y + 4, ph + 0.5, true, true);
  leg(hu.x + 3, hu.y + 2, ph + Math.PI + 0.5, false, true);
  // rabo
  const wag = st.wag ? Math.sin(st.t * 0.5) * 7 : Math.sin(st.t * 0.05) * 1.5;
  g.strokeStyle = DOGC.w; g.lineWidth = 2.4; g.beginPath(); g.moveTo(hu.x - 6, hu.y - 3);
  if (run) g.quadraticCurveTo(hu.x - 18, hu.y - 4, hu.x - 28, hu.y - 2 + Math.sin(ph) * 3);
  else g.quadraticCurveTo(hu.x - 14, hu.y + 2, hu.x - 16 + wag * 0.4, hu.y + 16 - Math.abs(wag) * 0.6);
  g.stroke();
  // corpo: peito fundo, cintura fina
  g.fillStyle = DOGC.w;
  g.beginPath();
  g.moveTo(hu.x - 6, hu.y - 4);
  g.quadraticCurveTo((hu.x + ch.x) / 2, ch.y - 12, ch.x + 4, ch.y - 9);
  g.quadraticCurveTo(ch.x + 12, ch.y - 2, ch.x + 6, ch.y + 9);
  g.quadraticCurveTo((hu.x + ch.x) / 2 + 4, ch.y + 3, hu.x + 5, hu.y + 4);
  g.quadraticCurveTo(hu.x - 9, hu.y + 4, hu.x - 6, hu.y - 4);
  g.fill();
  // mancha marrom no dorso
  g.save(); g.clip();
  ell(g, (hu.x + ch.x) / 2 - 3, ch.y - 9, 20, 7.5, 0.04, DOGC.tan);
  ell(g, hu.x - 2, hu.y - 4, 8, 5, 0, DOGC.tan);
  g.restore();
  // pernas da frente
  leg(ch.x + 2, ch.y + 4, ph, true, false);
  leg(hu.x + 4, hu.y + 2, ph + Math.PI, false, false);
  // pescoço e cabeça
  const look = st.look || 0;
  const hd = { x: ch.x + 11, y: ch.y - 15 + (run ? 4 : 0) + Math.sin(st.t * 0.04) * 0.6 + look };
  seg(g, ch.x + 3, ch.y - 3, hd.x - 1, hd.y + 2, 8, DOGC.w);
  seg(g, ch.x + 1, ch.y - 7, hd.x - 3, hd.y - 1, 3.5, DOGC.tan);
  ell(g, hd.x, hd.y, 5.4, 4.8, 0, DOGC.tan);
  g.fillStyle = DOGC.tan; g.beginPath(); g.moveTo(hd.x + 1, hd.y - 4); g.quadraticCurveTo(hd.x + 10, hd.y - 1, hd.x + 13, hd.y + 2); g.lineTo(hd.x + 2, hd.y + 4); g.fill();
  g.fillStyle = DOGC.w; g.beginPath(); g.moveTo(hd.x + 2, hd.y + 1); g.quadraticCurveTo(hd.x + 9, hd.y + 1.5, hd.x + 13, hd.y + 2.2); g.lineTo(hd.x + 4, hd.y + 4.5); g.fill();
  ell(g, hd.x + 13, hd.y + 1.6, 1.6, 1.4, 0, DOGC.nose);
  ell(g, hd.x + 3, hd.y - 1.2, 1.1, 1.1, 0, '#1a1410');
  // orelha dobrada (rosa)
  g.fillStyle = DOGC.tanD; g.beginPath(); g.moveTo(hd.x - 2, hd.y - 3.5); g.quadraticCurveTo(hd.x - 7, hd.y - 6 - (run ? 0 : Math.max(0, Math.sin(st.t * 0.03)) * 2), hd.x - 6, hd.y - 1); g.lineTo(hd.x - 1, hd.y - 1); g.fill();
}

function drawCrow(g, t, dead) {
  g.lineCap = 'round';
  const hop = dead ? 0 : Math.abs(Math.sin(t * 0.18)) * 1.5;
  const peck = !dead && (t % 160) > 140 ? 3 : 0;
  g.translate(0, -hop);
  if (dead) {
    const f = Math.sin(t * 0.7) * 0.9;
    g.fillStyle = '#16191c'; g.beginPath(); g.moveTo(-2, -10); g.lineTo(-16, -10 - 12 * f); g.lineTo(4, -8); g.fill();
  }
  g.fillStyle = '#101214';
  g.beginPath(); g.moveTo(-7, -9); g.lineTo(-16, -5); g.lineTo(-7, -4); g.fill();
  ell(g, 0, -8, 9, 6, -0.15, '#101214');
  ell(g, 7, -14 + peck, 4.2, 4, 0, '#101214');
  g.fillStyle = '#2a2b2c'; g.beginPath(); g.moveTo(10, -15 + peck); g.lineTo(16, -13 + peck); g.lineTo(10, -12 + peck); g.fill();
  ell(g, 8.4, -15 + peck, 1, 1, 0, '#e3dcc8');

function builder(w) {
  const g = Array.from({length: ROWS}, () => Array(w).fill('.'));
  const L = { g, w, decor: [], start: [2, 13], antonio: null, movers: [] };
  const set = (x, y, ch) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) g[y][x] = ch; };
  Object.assign(L, {
    ground(a, b, top) { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) set(x, y, '#'); },
    brick(a, b, top) { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) set(x, y, 'B'); },
    plat(a, b, y) { for (let x = a; x <= b; x++) set(x, y, '='); },
    water(a, b) { for (let x = a; x <= b; x++) for (let y = 15; y < ROWS; y++) set(x, y, '~'); },
    put(x, y, ch) { set(x, y, ch); },
    items(a, b, y, ch) { for (let x = a; x <= b; x++) set(x, y, ch); },
    dec(type, x, top, extra) { L.decor.push({ type, x, top, extra }); },
    setStart(x, y) { L.start = [x, y]; },
    setAntonio(x, y) { L.antonio = [x, y]; },
    mover(x, y, range) { L.movers.push({ x: x * T, y: y * T, w: 3 * T, h: 12, x0: x * T, x1: (x + range) * T, vx: 1.3 }); },
  });
  return L;
}

    ctx.fillStyle = 'rgba(255,255,255,.03)';
    for (let r = 0; r < 4; r++) ctx.fillRect(x, y + r*8 + 7, T, 1);
    if (roof) { ctx.fillStyle = th.edge; ctx.fillRect(x - 1, y, T + 2, 3); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - 1, y + 3, T + 2, 5); }
    else if ((ty % 3 === 1) && (tx % 3 === 1) && tile(tx-1, ty) === 'B' && tile(tx+1, ty) === 'B') {
      if (hash(tx, ty) > .62) {
        const gw = ctx.createRadialGradient(x + 16, y + 16, 2, x + 16, y + 16, 40); gw.addColorStop(0, `rgba(${th.lit},.3)`); gw.addColorStop(1, `rgba(${th.lit},0)`);
        ctx.fillStyle = gw; ctx.fillRect(x - 24, y - 24, 80, 80);
        ctx.fillStyle = `rgba(${th.lit},.85)`; ctx.fillRect(x + 9, y + 6, 14, 20);
        ctx.fillStyle = th.ground; ctx.fillRect(x + 15, y + 6, 2, 20);
      } else { ctx.fillStyle = '#222b38'; ctx.fillRect(x + 9, y + 6, 14, 20); }
    }
  } else if (c === 'X') {
    ctx.fillStyle = '#3a2e24'; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#5a4634'; ctx.fillRect(x, y, T, 3);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, y + 15, T, 2);
    ctx.strokeStyle = '#2a211a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + T - 4, y + T - 4); ctx.moveTo(x + T - 4, y + 4); ctx.lineTo(x + 4, y + T - 4); ctx.stroke();
  } else if (c === '=') {
    ctx.fillStyle = '#3a2e24'; ctx.fillRect(x, y, T + 1, 9);
    ctx.fillStyle = '#6a543e'; ctx.fillRect(x, y, T + 1, 2);
  } else if (c === '~') {
    const top = tile(tx, ty-1) !== '~';
    ctx.fillStyle = th.water; ctx.fillRect(x, y + (top ? 10 : 0), T + 1, T);
    if (top) {
      ctx.fillStyle = 'rgba(180,225,226,.5)';
      for (let k = 0; k < 4; k++) ctx.fillRect(x + k*8, y + 10 + Math.round(Math.sin(tx*4 + k + tick*0.06) * 1.5), 6, 1);
      ctx.fillStyle = `rgba(${th.light},.08)`; ctx.fillRect(x, y + 13, T + 1, 12);
    }
  } else if (c === '^') {
    ctx.fillStyle = '#121a14';
    ctx.beginPath(); ctx.moveTo(x, y + T);
    const pts = [[3,14],[7,22],[10,4],[14,18],[17,8],[21,20],[25,2],[28,16],[31,12]];
    for (const [px, py] of pts) ctx.lineTo(x + px, y + py);
    ctx.lineTo(x + T, y + T); ctx.fill();
    ctx.fillStyle = '#9b2f3a'; for (const [px, py] of [[9,20],[19,16],[24,24]]) { ctx.beginPath(); ctx.arc(x + px, y + py, 2, 0, 7); ctx.fill(); }
  }
}

function drawDecor(d, th) {
  const x = Math.round(d.x*T - cam), gy = d.top*T;
  if (x < -320 || x > VW + 320) return;
  const D = th.ground;
  switch (d.type) {
    case 'house': {
      ctx.fillStyle = '#2b2b30'; ctx.fillRect(x, gy - 150, 200, 150);
      ctx.fillStyle = '#4a2a26'; ctx.beginPath(); ctx.moveTo(x - 14, gy - 148); ctx.lineTo(x + 100, gy - 220); ctx.lineTo(x + 214, gy - 148); ctx.fill();
      ctx.fillStyle = '#2b2b30'; ctx.fillRect(x + 150, gy - 205, 18, 45);
      const lw = ctx.createRadialGradient(x + 50, gy - 90, 4, x + 50, gy - 90, 110); lw.addColorStop(0, `rgba(${th.lit},.45)`); lw.addColorStop(1, `rgba(${th.lit},0)`);
      ctx.fillStyle = lw; ctx.fillRect(x - 60, gy - 200, 220, 220);
      ctx.fillStyle = `rgba(${th.lit},.95)`; ctx.fillRect(x + 25, gy - 112, 50, 44);
      ctx.fillStyle = '#2b2b30'; ctx.fillRect(x + 49, gy - 112, 3, 44); ctx.fillRect(x + 25, gy - 92, 50, 3);
      ctx.fillStyle = '#3e2c22'; ctx.fillRect(x + 130, gy - 84, 42, 84);
      ctx.fillStyle = `rgba(${th.lit},.9)`; ctx.fillRect(x + 164, gy - 44, 3, 3);
      ctx.fillStyle = '#5a3a2c'; ctx.fillRect(x + 214, gy - 48, 60, 48);
      ctx.fillStyle = '#3e2a22'; ctx.beginPath(); ctx.moveTo(x + 206, gy - 46); ctx.lineTo(x + 244, gy - 74); ctx.lineTo(x + 282, gy - 46); ctx.fill();
      ctx.fillStyle = '#0c0d0e'; ctx.beginPath(); ctx.arc(x + 244, gy - 14, 14, Math.PI, 0); ctx.fillRect(x + 230, gy - 14, 28, 14); ctx.fill();
      ctx.fillStyle = 'rgba(241,234,219,.6)'; ctx.font = `600 9px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('ANTONIO', x + 244, gy - 34);
      ctx.fillStyle = '#c84a3a'; ctx.beginPath(); ctx.ellipse(x + 262, gy - 4, 8, 4, 0, 0, 7); ctx.fill();
      break;
    }
    case 'gate': {
      ctx.fillStyle = '#d9d6cc'; ctx.fillRect(x, gy - 60, 6, 60);
      ctx.save(); ctx.translate(x + 6, gy - 50); ctx.transform(1, -0.3, 0, 1, 0, 0);
      ctx.fillRect(0, 2, 30, 5); ctx.fillRect(0, 32, 30, 5);
      for (const o of [3, 13, 23]) ctx.fillRect(o, 0, 4, 44);
      ctx.restore(); break;
    }
    case 'fence': {
      ctx.fillStyle = '#c9c6bb';
      ctx.fillRect(x, gy - 34, T + 1, 4); ctx.fillRect(x, gy - 16, T + 1, 4);
      for (const o of [5, 21]) { ctx.fillRect(x + o, gy - 44, 6, 44); ctx.beginPath(); ctx.moveTo(x + o, gy - 44); ctx.lineTo(x + o + 3, gy - 49); ctx.lineTo(x + o + 6, gy - 44); ctx.fill(); }
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, gy - 6, T + 1, 6);
      break;
    }
    case 'tree': {
      ctx.drawImage(getTree((d.x * 7) % 8, D), x + 16 - 147, gy - 364 + 6, 294, 364);
      break;
    }
    case 'bush': {
      for (let k = 0; k < 14; k++) {
        const bx = x - 6 + k * 5, h = 14 + hash(d.x, k) * 18, sw = Math.sin(tick * 0.03 + k) * 2;
        ctx.fillStyle = k % 2 ? th.blade : D;
        ctx.beginPath(); ctx.moveTo(bx, gy); ctx.quadraticCurveTo(bx + 2, gy - h * 0.5, bx + 2 + (hash(k, d.x) - .5) * 8 + sw, gy - h); ctx.lineTo(bx + 5, gy); ctx.fill();
      }
      ctx.fillStyle = '#e6d48a'; ctx.beginPath(); ctx.arc(x + 14, gy - 22, 2.4, 0, 7); ctx.arc(x + 40, gy - 26, 2.4, 0, 7); ctx.fill();
      break;
    }
    case 'bench': {
      ctx.fillStyle = '#5a4532'; ctx.fillRect(x, gy - 28, 70, 5); ctx.fillRect(x, gy - 44, 70, 4);
      ctx.fillStyle = '#1e2422'; ctx.fillRect(x + 6, gy - 28, 4, 28); ctx.fillRect(x + 60, gy - 28, 4, 28); ctx.fillRect(x + 6, gy - 44, 3, 16); ctx.fillRect(x + 61, gy - 44, 3, 16);
      break;
    }
    case 'sign': {
      ctx.fillStyle = '#2a2420'; ctx.fillRect(x + 30, gy - 70, 5, 70);
      ctx.fillStyle = '#6a5038'; ctx.fillRect(x - 4, gy - 86, 100, 26);
      ctx.fillStyle = 'rgba(241,234,219,.85)'; ctx.font = `600 11px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(d.extra, x + 46, gy - 69);
      break;
    }
    case 'antenna': {
      ctx.fillStyle = D; ctx.fillRect(x + 14, gy - 80, 3, 80); ctx.fillRect(x, gy - 72, 32, 2); ctx.fillRect(x + 4, gy - 58, 24, 2);
      if (Math.floor(tick / 50) % 2) { ctx.fillStyle = 'rgba(230,70,70,.95)'; ctx.beginPath(); ctx.arc(x + 15.5, gy - 82, 3, 0, 7); ctx.fill(); }
      break;
    }
    case 'chimney': {
      ctx.fillStyle = '#4a2c26'; ctx.fillRect(x + 6, gy - 48, 24, 48); ctx.fillStyle = D; ctx.fillRect(x + 2, gy - 52, 32, 6);
      for (let k = 0; k < 3; k++) { const s = (tick * 0.4 + k * 20) % 60; ctx.fillStyle = `rgba(220,210,205,${0.22 * (1 - s/60)})`; ctx.beginPath(); ctx.arc(x + 18 + s * 0.5, gy - 58 - s, 6 + s * 0.2, 0, Math.PI*2); ctx.fill(); }
      break;
    }
    case 'paw': {
      ctx.fillStyle = 'rgba(245,232,200,.42)';
      const px = x + 10 + (d.flip ? 8 : 0), py = gy - 3;
      ctx.beginPath(); ctx.ellipse(px + 3, py, 3.2, 2.2, 0, 0, 7); ctx.fill();
      for (const [dx, dy] of [[-1.5,-3.5],[1.5,-4.8],[4.5,-4.8],[7.5,-3.5]]) { ctx.beginPath(); ctx.arc(px + dx, py + dy, 1.1, 0, 7); ctx.fill(); }
      break;
    }
  }
}

function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 1, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function shadowAt(x, y, w, a) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.beginPath(); ctx.ellipse(x, y, w, 3, 0, 0, 7); ctx.fill(); }
function drawSpeech(b, cx, top) {
  if (!b) return;
  const a = Math.min(1, b.t / 20, (b.max - b.t + 1) / 8);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `600 16px ${FONT}`; ctx.textAlign = 'center';
  const tx = clamp(cx, 120, VW - 120), ty = top - 18;
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#f6efe0'; ctx.fillText(b.text, tx, ty);
  ctx.restore();
}
function boyState(p) { return { speed: p.animS, phase: p.phase, ground: p.onGround, vy: p.vy, land: p.land, t: tick }; }

function drawWorld() {
  const theme = LEVELS[li].theme, th = THEMES[theme];
  drawBackground(theme);
  for (const d of decor) if (d.type !== 'paw') drawDecor(d, th);
  const c0 = Math.max(0, Math.floor(cam / T) - 1), c1 = Math.min(W - 1, Math.ceil((cam + VW) / T) + 1);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = c0; tx <= c1; tx++) { const c = grid[ty][tx]; if (c !== '.') drawTile(c, tx, ty, th); }
  for (const d of decor) if (d.type === 'paw') drawDecor(d, th);
  for (const m of movers) {
    const x = Math.round(m.x - cam);
    ctx.strokeStyle = 'rgba(20,22,24,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 12, m.y); ctx.lineTo(x + 12, 0); ctx.moveTo(x + m.w - 12, m.y); ctx.lineTo(x + m.w - 12, 0); ctx.stroke();
    ctx.fillStyle = '#3a2e24'; ctx.fillRect(x, m.y, m.w, m.h);
    ctx.fillStyle = '#6a543e'; ctx.fillRect(x, m.y, m.w, 2);
  }
  for (const e of ents) {
    if (e.gone) continue;
    const cx = e.x + e.w/2 - cam;
    if (cx < -60 || cx > VW + 60) continue;
    if (e.type === 'bone') { glow(cx, e.y + 7, 24, '255,240,200', 0.35); boneShape(ctx, cx, e.y + 7, 1); }
    else if (e.type === 'heart') { glow(cx, e.y + 8, 28, '230,90,100', 0.4); heartShape(ctx, cx, e.y + 8, 1.2, '#d9505c'); }
    else {
      ctx.save(); ctx.translate(Math.round(cx), Math.round(e.y + e.h)); ctx.scale(e.face || 1, 1); ctx.scale(1.15, 1.15);
      if (e.type === 'crow') drawCrow(ctx, e.t || 0, e.dead);
      else { ctx.globalAlpha = e.dead ? 0.6 : 1; glow(0, -6, 18, '255,236,180', 0.25); drawMoth(ctx, e.t || 0); }
      ctx.restore();
    }
  }
  const a = antonio;
  if (a.state !== 'gone') {
    const hop = a.state === 'found' ? -Math.abs(Math.sin(a.t * 0.2)) * 10 : 0;
    const cx = a.x + a.w/2 - cam;
    glow(cx, a.y + 16 + hop, 95, '255,248,228', 0.26 + Math.sin(tick * 0.05) * 0.04);
    shadowAt(cx, a.y + a.h + 1, 26, 0.3);
    ctx.save(); ctx.translate(Math.round(cx), Math.round(a.y + a.h + 1 + hop)); ctx.scale(a.face * 1.12, 1.12);
    drawDog(ctx, { speed: a.state === 'run' ? 1 : 0, phase: a.phase, t: a.t, wag: a.state !== 'idle' && a.state !== 'run', look: a.state === 'idle' ? Math.sin(a.t * 0.02) * 1.5 : 0 });
    ctx.restore();
  }
  const p = player;
  if (!(p.inv > 0 && Math.floor(p.inv / 4) % 2)) {
    const hop = a.state === 'found' ? -Math.abs(Math.sin(a.t * 0.2 + 1)) * 8 : 0;
    const cx = p.x + p.w/2 - cam, bot = p.y + p.h + 1 + hop;
    if (p.onGround) shadowAt(cx, p.y + p.h + 1, 11, 0.32);
    ctx.save(); ctx.translate(cx, bot); ctx.scale(p.face * 1.12, 1.12);
    drawBoy(ctx, boyState(p), HEROES[heroIdx]);
    ctx.restore();
  }
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    const x = q.x - cam, y = q.y;
    if (q.kind === 'heart') heartShape(ctx, x, y, 0.7, q.c);
    else if (q.kind === 'feather') { ctx.fillStyle = q.c; ctx.save(); ctx.translate(x, y); ctx.rotate(q.life * 0.1); ctx.fillRect(-3, -1, 6, 2); ctx.restore(); }
    else if (q.kind === 'star') { ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  if (theme !== 'city') {
    const f = 1.5, camx = cam * f, sw = 520;
    for (let s = Math.floor(camx / sw) - 1; s <= Math.floor(camx / sw) + 3; s++) {
      if (hash(s, 99) > 0.55) continue;
      const bx = s * sw - camx + hash(99, s) * 200;
      ctx.fillStyle = '#0b120e';
      for (let k = 0; k < 9; k++) { const h = 60 + hash(s * 13 + k, 5) * 120, xx = bx + k * 9, sw2 = Math.sin(tick * 0.02 + k) * 4; ctx.beginPath(); ctx.moveTo(xx, VH); ctx.quadraticCurveTo(xx + 8, VH - h * 0.6, xx + 4 + (hash(k, s) - .5) * 30 + sw2, VH - h); ctx.lineTo(xx + 7, VH); ctx.fill(); }
    }
  } else {
    const f = 1.6, camx = cam * f, sw = 700;
    for (let s = Math.floor(camx / sw) - 1; s <= Math.floor(camx / sw) + 2; s++) {
      if (hash(s, 77) > 0.5) continue;
      const bx = s * sw - camx + hash(77, s) * 300;
      ctx.fillStyle = '#07090d'; ctx.fillRect(bx, VH - 220, 14, 220); ctx.fillRect(bx - 30, VH - 220, 74, 6);
    }
    ctx.strokeStyle = 'rgba(210,220,235,.18)'; ctx.lineWidth = 1; ctx.beginPath();
    for (const r of rain) { r.y += r.v; r.x -= r.v * 0.25; if (r.y > VH) { r.y = -20; r.x = Math.random() * (VW + 100); } ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.l * 0.25, r.y + r.l); }
    ctx.stroke();
  }
  ctx.fillStyle = `rgba(${th.light},.5)`;
  for (const m of motes) {
    m.s += 0.01; const x = ((m.x - cam * m.z * 0.3) % VW + VW) % VW, y = m.y + Math.sin(m.s) * 12;
    ctx.globalAlpha = 0.25 + 0.4 * Math.sin(m.s * 1.3) ** 2; ctx.fillRect(x, y, m.z > 0.9 ? 2 : 1, m.z > 0.9 ? 2 : 1);
  }
  ctx.globalAlpha = 1;
  drawSpeech(kidBubble, p.x + p.w/2 - cam, p.y - 6);
  if (a.state !== 'gone') drawSpeech(dogBubble, a.x + a.w/2 - cam, a.y - 4);
}

function drawPost(theme) {
  const th = THEMES[theme];
  // gradação de cor: luz quente no alto
  ctx.save(); ctx.globalCompositeOperation = 'soft-light';
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, `rgba(${th.light},.45)`); g.addColorStop(1, 'rgba(20,40,50,.35)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH); ctx.restore();
  ctx.drawImage(VIG, 0, 0);
  if (!grainPat) grainPat = ctx.createPattern(GRAIN, 'repeat');
  ctx.save(); ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(Math.floor(Math.random() * 256), Math.floor(Math.random() * 256));
  ctx.fillStyle = grainPat; ctx.fillRect(-256, -256, VW + 512, VH + 512);
  ctx.restore();
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, VW, VH); }
}

function drawHUD() {
  ctx.save();
  ctx.globalAlpha = 0.9;
  for (let i = 0; i < Math.max(3, hearts); i++) heartShape(ctx, 30 + i * 22, 30, 0.95, i < hearts ? '#d9505c' : 'rgba(255,255,255,.18)');
  boneShape(ctx, 32, 54, 0.9);
  ctx.font = `600 14px ${FONT}`; ctx.fillStyle = '#f1eadb'; ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 4;
  ctx.fillText(`${bonesLevel} / ${bonesLevelTotal}`, 50, 59);
  ctx.shadowBlur = 0;
  const a = antonio;
  if (a.state === 'idle' || a.state === 'wait') {
    const pct = clamp(player.x / a.x, 0, 1);
    ctx.fillStyle = 'rgba(241,234,219,.2)'; ctx.fillRect(VW/2 - 120, 24, 240, 2);
    ctx.fillStyle = 'rgba(241,234,219,.8)'; ctx.fillRect(VW/2 - 120, 24, 240 * pct, 2);
    ctx.beginPath(); ctx.arc(VW/2 + 124, 25, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  if (titleT > 0) {
    const t = 300 - titleT, al = Math.min(1, t / 50, titleT / 60);
    ctx.save(); ctx.globalAlpha = al; ctx.textAlign = 'center'; ctx.fillStyle = '#f6efe0';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 14;
    ctx.font = `300 14px ${FONT}`; ctx.fillText(LEVELS[li].num, VW/2, VH * 0.33);
    ctx.font = `300 40px ${FONT}`; ctx.fillText(LEVELS[li].name.toUpperCase().split('').join(' '), VW/2, VH * 0.33 + 46);
    ctx.font = `300 16px ${FONT}`; ctx.fillText(LEVELS[li].intro, VW/2, VH * 0.33 + 82);
    ctx.restore();
  }
}

let titleDog = { phase: 0 };
function drawTitle() {
  cam = tick * 0.4;
  drawBackground('yard');
  const th = THEMES.yard;
  ctx.fillStyle = th.ground; ctx.fillRect(0, VH - 70, VW, 70);
  ctx.fillStyle = th.edge; ctx.fillRect(0, VH - 70, VW, 3);
  glow(780, VH - 95, 120, '255,248,228', 0.3);
  shadowAt(780, VH - 69, 30, 0.3);
  ctx.save(); ctx.translate(780, VH - 69); ctx.scale(-1.6, 1.6);
  drawDog(ctx, { speed: 0, phase: 0, t: tick, wag: true, look: Math.sin(tick * 0.02) * 1.5 });
  ctx.restore();
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000/60) { if (state === 'play') update(); else tick++; acc -= 1000/60; }
  if (grid) { drawWorld(); drawPost(LEVELS[li].theme); drawHUD(); } else { drawTitle(); drawPost('yard'); }
  requestAnimationFrame(loop);
}

/* ---------------- interface ---------------- */
const menu = document.getElementById('menu'), msg = document.getElementById('msg');
const heroesEl = document.getElementById('heroes'), nameEl = document.getElementById('name');
let msgCb = null;
const heroCanvases = [];
HEROES.forEach((h, i) => {

});
function drawHeroCards() {
  if (menu.classList.contains('hidden')) return;

    const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);

}
setInterval(drawHeroCards, 33);
function showMenu() { menu.classList.remove('hidden'); msg.classList.add('hidden'); grid = null; }

  document.getElementById('msgBtn').textContent = btn;

document.getElementById('startBtn').onclick = () => {

const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => {

/* ---------------- pausa ---------------- */
const pauseEl = document.getElementById('pause'), menuBtn = document.getElementById('menuBtn');
function stopVoice() { try { if (voiceSrc) voiceSrc.stop(); } catch (e) {} }
function openPause() {
  if (state !== 'play') return;
  state = 'pause'; keys.left = keys.right = keys.jump = false; stopVoice();
  pauseEl.classList.remove('hidden');
}
function closePause() { pauseEl.classList.add('hidden'); if (state === 'pause') state = 'play'; }
menuBtn.onclick = () => { menuBtn.blur(); state === 'pause' ? closePause() : openPause(); };
document.getElementById('pResume').onclick = closePause;
document.getElementById('pRestart').onclick = () => { pauseEl.classList.add('hidden'); startLevel(li); };
document.getElementById('pReset').onclick = () => { pauseEl.classList.add('hidden'); bonesAll = 0; bonesAllTotal = 0; startLevel(0); };
document.getElementById('pQuit').onclick = () => { pauseEl.classList.add('hidden'); stopVoice(); state = 'menu'; showMenu(); };
setInterval(() => { menuBtn.classList.toggle('hidden', !(state === 'play' || state === 'pause')); }, 200);
document.addEventListener('visibilitychange', () => { if (document.hidden) openPause(); });

/* ---------------- controles ---------------- */
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', Space:'jump', ArrowUp:'jump', KeyW:'jump', KeyZ:'jump' };
window.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT') { if (e.code === 'Enter') document.getElementById('startBtn').click(); return; }
  if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); state === 'pause' ? closePause() : openPause(); return; }
  if (state === 'pause') return;
  if (e.code === 'Enter' && !msg.classList.contains('hidden')) { document.getElementById('msgBtn').click(); e.preventDefault(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); ensureAudio();
  if (k === 'jump' && !keys.jump) keys.jumpPressed = true;
  keys[k] = true;
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
window.addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });

const touchEl = document.getElementById('touch');
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) touchEl.classList.remove('hidden');
for (const [id, k] of [['tl', 'left'], ['tr', 'right'], ['tj', 'jump']]) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); ensureAudio(); if (k === 'jump' && !keys.jump) keys.jumpPressed = true; keys[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
}

window.__game = { get clips() { return Object.keys(clipBuf); }, get cam() { return cam; }, get state() { return state; }, get player() { return player; }, startLevel, set fade(v) { fade = v; }, set titleT(v) { titleT = v; } };
requestAnimationFrame(loop);
})();
</script>
